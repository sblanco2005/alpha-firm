document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

33.3%',\n        pnl: '+$90.69', pnlColor: GREEN,\n        blurb: 'Hunts beaten-down names with improving fundamentals. Every thesis needs all three: cheap + improving + catalyst.',\n        edge: 'Captures the highest-magnitude moves when consensus is wrong — and is naturally uncorrelated with the other agents.',\n        c910: 'Extreme pessimism + clear fundamental improvement + a catalyst forcing re-rating.',\n        c78: 'Significant pessimism with early improvement and a reasonable timeline.',\n        c56: 'Interesting value setup but no clear catalyst or improvement yet.',\n        recent: [{ t: 'SYK', r: '+4.8%', up: true }] }),\n      catalyst: mk({ name: 'Catalyst Agent', tag: 'The Clockwatcher', emoji: '⏱', color: '#4D7CFF',\n        status: 'CONVICTION 8+ TO EXECUTE', statusColor: '#4D7CFF', picks: 15, executed: 3, winRate: '23.3%',\n        pnl: '+$17.32', pnlColor: GREEN,\n        blurb: 'Trades known future events before the market fully prices them — earnings, FDA dates, FOMC, launches. Models both outcomes, only acts on mispricing.',\n        edge: 'Forward-looking specificity — known dates and quantifiable outcomes, not vibes. No date = no trade.',\n        c910: 'Known date + specific asymmetry (market ~50%, you assess 75%+) + bounded downside.',\n        c78: 'Clear catalyst with probable outcome, some uncertainty on timing or scope.',\n        c56: 'Event identified but market may already be pricing the outcome.',\n        recent: [{ t: 'CAT', r: '+18.9%', up: true }] }),\n      macro: mk({ name: 'Macro Strategist', tag: 'The Big Picture', emoji: '🌐', color: '#F5B731',\n        status: 'BENCHED · 0.5× · CONV 8+ FLOOR', statusColor: '#FF5C6A', picks: 25, executed: 1, winRate: '10.0%',\n        pnl: '−$2.16', pnlColor: RED,\n        blurb: 'The big picture — Fed policy, Treasury yields, geopolitical risk, currency and commodity cycles. Trades broad instruments on regime shifts.',\n        edge: 'Identifies regime transitions before they’re consensus — risk-on→risk-off, growth→stagflation.',\n        c910: 'Clear regime shift or policy pivot with asymmetric risk/reward.',\n        c78: 'Strong macro setup with confirming data and reasonable risk.',\n        c56: 'Interesting setup but conflicting signals or unclear timing.',\n        recent: [] }),\n      crypto: mk({ name: 'Crypto Analyst', tag: 'On-Chain', emoji: '₿', color: '#F7931A',\n        status: 'STOCKS ONLY · ETF PICKS BANNED', statusColor: '#F7931A', picks: 30, executed: 8, winRate: '62.0%',\n        pnl: '−$51.55', pnlColor: RED,\n        blurb: 'Bitcoin on-chain metrics, mining equities, ETF flows and regulatory catalysts. Watches exchange reserves, MVRV Z-Score and hash rate.',\n        edge: 'On-chain data provides signals — exchange outflows, hash-rate trends — that traditional analysts miss entirely.',\n        c910: 'On-chain divergence (exchange outflows while price flat) + an upcoming catalyst.',\n        c78: 'Strong setup with one confirming signal — ETF flows, hash rate, regulatory clarity.',\n        c56: 'Interesting, but volatility could go either way.',\n        recent: [{ t: 'CLSK', r: '−0.7%', up: false }] }),\n      quant: mk({ name: 'Momentum Quant', tag: 'The Machine', emoji: '📊', color: '#2DD4D4',\n        status: 'SUSPENDED → JUL 8', statusColor: '#FF5C6A', picks: 30, executed: 15, winRate: '42.6%',\n        pnl: '−$106.98', pnlColor: RED,\n        blurb: 'Pure technicals — a weighted model: momentum (3×), volume (2×), relative strength (2×), volatility (1×), catalyst proximity (2×).',\n        edge: 'Systematic scoring removes emotional bias and catches trend acceleration early.',\n        c910: 'Multi-factor alignment — momentum, volume, relative strength all confirm + near-term catalyst.',\n        c78: 'Strong momentum with volume confirmation, one factor slightly off.',\n        c56: 'Decent setup but missing volume or relative-strength confirmation.',\n        recent: [{ t: 'MU', r: '+7.4%', up: true }, { t: 'FDX', r: '−1.7%', up: false }] }),\n    };\n\n    const tab = this.state.tab, selA = this.state.selA, step = this.state.liveStep;\n\n    const liveAgents = [\n      { name: 'Macro', emoji: '🌐', color: '#F5B731', ticker: 'SPY', conv: 5, convPct: '50%', note: 'benched · 0.5×', dim: true },\n      { name: 'Crypto', emoji: '₿', color: '#F7931A', ticker: 'IREN', conv: 7, convPct: '70%', note: 'hash-rate breakout', dim: false },\n      { name: 'Quant', emoji: '📊', color: '#2DD4D4', ticker: 'AMD', conv: 6, convPct: '60%', note: 'suspended', dim: true },\n      { name: 'Sentiment', emoji: '📡', color: '#FF4D9D', ticker: 'PLTR', conv: 8, convPct: '80%', note: 'insider cluster', dim: false, star: true },\n      { name: 'Contrarian', emoji: '🃏', color: '#A05CFF', ticker: 'PYPL', conv: 7, convPct: '70%', note: 'cheap + turning', dim: false },\n      { name: 'Catalyst', emoji: '⏱', color: '#4D7CFF', ticker: 'NVDA', conv: 8, convPct: '80%', note: 'earnings in 3d', dim: false },\n    ].map(g => {\n      const r = parseInt(g.color.slice(1,3),16), gg = parseInt(g.color.slice(3,5),16), b = parseInt(g.color.slice(5,7),16);\n      return { ...g, border: `rgba(${r},${gg},${b},.3)`, opacity: g.dim ? 0.5 : 1, star: !!g.star };\n    });\n\n    return {\n      showPortfolio: tab === 'portfolio',\n      showRoster: tab === 'analysts' && !selA,\n      showDetail: tab === 'analysts' && !!selA,\n      showLive: tab === 'live',\n      showLeague: tab === 'league',\n      a: selA ? A[selA] : null,\n\n      goPortfolio: () => this.setState({ tab: 'portfolio', selA: null }),\n      goAnalysts: () => this.setState({ tab: 'analysts', selA: null }),\n      goLive: () => this.setState({ tab: 'live' }),\n      goLeague: () => this.setState({ tab: 'league' }),\n      closeA: () => this.setState({ selA: null }),\n      openSentiment: () => this.open('sentiment'),\n      openContrarian: () => this.open('contrarian'),\n      openCatalyst: () => this.open('catalyst'),\n      openMacro: () => this.open('macro'),\n      openCrypto: () => this.open('crypto'),\n      openQuant: () => this.open('quant'),\n\n      pColor: tab === 'portfolio' ? ACT : INA,\n      aColor: tab === 'analysts' ? ACT : INA,\n      lColor: tab === 'live' ? ACT : INA,\n      gColor: tab === 'league' ? ACT : INA,\n\n      liveIdle: step === 0,\n      liveRunning: step >= 1,\n      scanning: step < 2,\n      recsReady: step >= 2,\n      debateReady: step >= 3,\n      verdictReady: step >= 4,\n      liveAgents,\n      liveStatus: ['', 'Dispatching 6 analysts in parallel…', 'Scoring recommendations…', 'Capital-protection debate on top picks…', 'PM decision logged'][step],\n      runCheck: () => this.runCheck(),\n      resetCheck: () => this.setState({ liveStep: 0 }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
